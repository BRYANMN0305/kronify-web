<div class="onboarding-page d-flex flex-column min-vh-100">
  <div class="p-3 p-md-4">
    <button class="btn btn-sm rounded-2 px-3 btn-back" (click)="handleBack()">
      ← Volver
    </button>
  </div>

  <div class="flex-grow-1 d-flex align-items-center justify-content-center p-4">
    <div class="w-100" style="max-width: 560px;">
      <app-onboarding-business-form
        [submitting]="submitting()"
        [errorMessage]="errorMessage()"
        (submitForm)="onSubmitForm($event)"/>
    </div>
  </div>
</div>
