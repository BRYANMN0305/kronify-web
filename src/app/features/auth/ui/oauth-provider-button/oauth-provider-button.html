<button type="button"
        class="btn btn-outline-light w-100 d-flex align-items-center justify-content-center gap-2"
        [disabled]="disabled()"
        (click)="selected.emit(provider().id)">
  <img [src]="provider().icon" [alt]="provider().label" width="18" height="18"/>
  {{ provider().label }}
</button>
