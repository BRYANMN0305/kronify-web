<div class="d-flex flex-column gap-2">
  <button type="button"
          class="btn btn-outline-light d-flex align-items-center justify-content-center gap-2"
          [disabled]="disabled()"
          (click)="oauth.emit('google')">
    <img src="/images/auth/google.svg" alt="Google" width="18" height="18"/>
    Continuar con Google
  </button>

  <button type="button"
          class="btn btn-outline-light d-flex align-items-center justify-content-center gap-2"
          [disabled]="disabled()"
          (click)="oauth.emit('microsoft')">
    <img src="/images/auth/microsoft.svg" alt="Microsoft" width="18" height="18"/>
    Continuar con Microsoft
  </button>
</div>
