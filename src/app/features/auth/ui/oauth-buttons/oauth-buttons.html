<div class="d-flex flex-column gap-2">
  @for (provider of providers; track provider.id) {
    <app-oauth-provider-button
      [provider]="provider"
      [disabled]="disabled()"
      (selected)="oauth.emit($event)"/>
  } @empty {
    <p class="oauth-empty">No hay proveedores de autenticación disponibles.</p>
  }
</div>
