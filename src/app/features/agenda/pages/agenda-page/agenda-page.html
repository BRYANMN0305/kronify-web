<section class="agenda-page">
  <div class="agenda-kicker">CALENDARIO OPERATIVO</div>
  <header class="agenda-toolbar">
    <div class="agenda-title-group">
      <h1>Calendario</h1>
      <div class="month-switcher">
        <button type="button" class="month-arrow" (click)="previousMonth()" aria-label="Mes anterior">‹</button>
        <h2>{{ monthLabel() | titlecase }}</h2>
        <button type="button" class="month-arrow" (click)="nextMonth()" aria-label="Mes siguiente">›</button>
      </div>
    </div>
    <div class="agenda-controls">
      <label class="agenda-select-wrap"><span class="visually-hidden">Filtrar por empleado</span>
        <select class="agenda-select" [value]="selectedEmployee()" (change)="setEmployee($any($event.target).value)">
          @for (employee of employees(); track employee) { <option [value]="employee">{{ employee === 'TODOS' ? 'Todos los empleados' : employee }}</option> }
        </select>
      </label>
      <label class="agenda-select-wrap"><span class="visually-hidden">Filtrar por servicio</span>
        <select class="agenda-select" [value]="selectedService()" (change)="setService($any($event.target).value)">
          @for (service of services(); track service) { <option [value]="service">{{ service === 'TODOS' ? 'Todos los servicios' : service }}</option> }
        </select>
      </label>
      <label class="agenda-select-wrap"><span class="visually-hidden">Filtrar por estado</span>
        <select class="agenda-select" [value]="selectedStatus()" (change)="setStatus($any($event.target).value)">
          @for (filter of statusFilters; track filter.value) { <option [value]="filter.value">{{ filter.label }}</option> }
        </select>
      </label>
      @if (isDemo()) { <button class="agenda-new-button" type="button" disabled><span>＋</span> Nueva cita</button> } @else { <button class="agenda-new-button" type="button" (click)="openCreateDialog()"><span>＋</span> Nueva cita</button> }
    </div>
  </header>

  <app-agenda-summary [confirmed]="store.confirmedCount()" [total]="store.appointmentCount()" [revenue]="revenueLabel()" />

  @if (storeError()) {
    <div class="agenda-api-alert" role="status"><span class="alert-icon">!</span><div><strong>No se pudo conectar con la agenda</strong><p>{{ storeError() }}</p></div></div>
  } @else if (isDemo()) {
    <div class="agenda-demo-alert" role="status">Vista de demostración · datos de ejemplo</div>
  }

  <app-calendar-grid [weeks]="calendarWeeks()" [selectedKey]="selectedDayKey()" (daySelected)="selectDay($event)" />

</section>

@if (dayDialogOpen()) {
  <app-day-appointments-dialog [date]="selectedDate().toDate()" [appointments]="visibleAppointments()" (closed)="closeDayDialog()" (statusChange)="updateAppointmentStatus($event)" />
}
@if (createDialogOpen()) {
  <app-create-appointment-dialog (closed)="closeCreateDialog()" (created)="appointmentCreated()" />
}
