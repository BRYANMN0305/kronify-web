<section class="agenda-page">
  <div class="agenda-kicker">CALENDARIO OPERATIVO</div>
  <header class="agenda-toolbar">
    <div class="agenda-title-group">
      <h1>Calendario</h1>
      <div class="month-switcher">
        <button type="button" class="month-arrow" (click)="previousMonth()" aria-label="Mes anterior">‹</button>
        <h2>{{ monthLabel() | titlecase }}</h2>
        <button type="button" class="month-arrow" (click)="nextMonth()" aria-label="Mes siguiente">›</button>
      </div>
    </div>
    <div class="agenda-controls">
      @if (isDemo()) { <button class="btn-kronify agenda-new-button" type="button" disabled><span>＋</span> Nueva cita</button> } @else { <button class="btn-kronify agenda-new-button" type="button" (click)="openCreateDialog()"><span>＋</span> Nueva cita</button> }
    </div>
  </header>

  <app-agenda-summary
    [total]="store.appointmentCount()"
    [confirmed]="store.confirmedCount()"
    [pending]="store.pendingCount()"
    [completed]="store.completedCount()" />

  @if (storeError()) {
    <div class="agenda-api-alert" role="status"><span class="alert-icon">!</span><div><strong>No se pudo conectar con la agenda</strong><p>{{ storeError() }}</p></div></div>
  } @else if (isDemo()) {
    <div class="agenda-demo-alert" role="status">Vista de demostración · datos de ejemplo</div>
  }

  <app-calendar-grid [weeks]="calendarWeeks()" [selectedKey]="selectedDayKey()" (daySelected)="selectDay($event)" />

</section>

@if (dayDialogOpen()) {
  <app-day-appointments-dialog [date]="selectedDate().toDate()" [appointments]="visibleAppointments()" (closed)="closeDayDialog()" (dayShift)="shiftDay($event)" (statusChange)="updateAppointmentStatus($event)" />
}
@if (createDialogOpen()) {
  <app-create-appointment-dialog (closed)="closeCreateDialog()" (created)="appointmentCreated()" />
}
