<div class="settings-page p-3 p-md-4">
  <header class="mb-4">
    <h1 class="h3 mb-1">Configuración</h1>
    <p class="text-secondary mb-0">Administra tu cuenta y tu negocio.</p>
  </header>

  <section class="settings-section">
    <h2 class="h5 mb-2">Mis datos</h2>
    <p class="text-secondary small mb-0">La edición de datos personales se migrará próximamente.</p>
  </section>

  <section class="settings-logout-mobile mt-4">
    <button type="button" class="settings-logout-btn" (click)="handleLogout()">
      <span class="settings-logout-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </span>
      Cerrar sesión
    </button>
  </section>
</div>
